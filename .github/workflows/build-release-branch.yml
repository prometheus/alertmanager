---
name: Build release branch
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - release-*
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ci:
    name: Run ci
    uses: $/.github/workflows/ci.yml

  build:
    name: Build Alertmanager for all architectures
    needs: ci
    uses: $/.github/workflows/build.yml
