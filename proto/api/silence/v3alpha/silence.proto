syntax = "proto3";

package silence.v3alpha;

import "buf/validate/validate.proto";
import "common/v3alpha/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/prometheus/alertmanager/api/silence/v3alpha;silencev3alpha";

service SilenceService {
  // ListSilences reads stored silences, including multiple alert matcher sets.
  // Ordering is active, pending, expired; then ascending end time for active,
  // ascending start time for pending, and descending end time for expired.
  // IDs break ties. State is calculated at ListSilencesResponse.evaluated_at.
  // Pagination fields may be added in a later revision.
  rpc ListSilences(ListSilencesRequest) returns (ListSilencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Silence is the resource used for reads and writes.
message Silence {
  // Assigned on creation. Required when updating an existing silence.
  string id = 1;
  // OR across sets and AND within each set when matching alert labels.
  repeated common.v3alpha.MatcherSet matcher_sets = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.cel = {
      id: "matcher_set.non_empty"
      message: "a matcher set needs at least one matcher"
      expression: "this.matchers.size() > 0"
    }
  ];
  // Defaults to the request time when omitted on creation.
  google.protobuf.Timestamp starts_at = 3;
  // Can equal starts_at when a pending silence is expired.
  google.protobuf.Timestamp ends_at = 4 [(buf.validate.field).required = true];
  string created_by = 5;
  string comment = 6;
  map<string, string> annotations = 7;
  // Calculated by the server at the response evaluation time.
  SilenceStatus status = 8;
  // Set by the server when the silence changes.
  google.protobuf.Timestamp updated_at = 9;
  // Receiver matcher sets are returned as stored.
  // They do not currently affect muting.
  repeated common.v3alpha.MatcherSet receiver_matcher_sets = 10;

  option (buf.validate.message).cel = {
    id: "silence.time_range"
    message: "ends_at must not be before starts_at"
    expression: "!has(this.starts_at) || !has(this.ends_at) || this.ends_at >= this.starts_at"
  };
}

enum SilenceState {
  SILENCE_STATE_UNSPECIFIED = 0;
  SILENCE_STATE_ACTIVE = 1;
  SILENCE_STATE_PENDING = 2;
  SILENCE_STATE_EXPIRED = 3;
}

message SilenceStatus {
  // Active means starts_at <= evaluation time < ends_at.
  SilenceState state = 1;
}

message ListSilencesRequest {
  // Definition filters, not predicates evaluated against alert labels.
  // A requested set matches if every matcher occurs with identical name, type,
  // and value in one stored matcher set. OR across requested sets, AND within
  // each set. No sets or an empty set selects every definition.
  repeated common.v3alpha.MatcherSet matcher_filters = 1;
  // Empty selects all states. Unspecified and unknown values are invalid.
  repeated SilenceState states = 2 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ListSilencesResponse {
  repeated Silence silences = 1;
  // Evaluation time for state filtering, status, and ordering.
  google.protobuf.Timestamp evaluated_at = 2;
}
